services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/customer/dist:/usr/share/nginx/html/customer:ro
      - ./frontend/admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - backend
      - postgres
      - customer-app
      - admin-app
    networks:
      - ecommerce-network

  customer-app:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    volumes:
      - ./frontend/customer/src:/app/src:ro
    networks:
      - ecommerce-network
    # Dev mode: use nginx serve; prod: built artifact

  admin-app:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    volumes:
      - ./frontend/admin/src:/app/src:ro
    networks:
      - ecommerce-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/herbalcommerce
      - JWT_SECRET=your-jwt-secret-change-in-production
      - JWT_REFRESH_SECRET=your-refresh-secret-change-in-production
      - PORT=3000
    volumes:
      - ./backend/src:/app/src:ro
      - ./database/migrations:/app/database/migrations:ro
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=herbalcommerce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_migrations.sql:ro
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - ecommerce-network

volumes:
  postgres-data:

networks:
  ecommerce-network:
    driver: bridge
